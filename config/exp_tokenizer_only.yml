# Martin data-loader experiment: the 4 tokenizer flags only (bisects exp_readproc_all.yml).
# Tokenization changes: loss must stay almost identical to the profiled baseline.
# Use with --base-config config/config_operan_georing_avhrr_forecasting_lowres.yml.
# Flag documentation: docs/martin_dataloader_flags.md
profiling:
  memory_profiling: False
  pytorch_profiling: False
  only_profiling: False

train_logging:
  memory_tracking: True
  throughput_tracking: True
  metrics: 1
  terminal: 10

data_loading:
  rng_seed: 1
  # writes <run_dir>/dataloader_profile/: per-sample stage times, loader waits, memory CSV
  profile_timing: True
  profile_memory_timeline: True
  profile_memory_interval_seconds: 0.5
  optimizations:
    tokenize_coords_only: True
    source_direct_build: True
    target_requested_fields_only: True
    skip_train_inverse_indices: True

training_config:
  start_date: 2017-06-01T00:00
  num_mini_epochs: 1
  # 1 sample per GPU x 4 GPUs -> 100 steps
  samples_per_mini_epoch: 400

validation_config:
  samples_per_mini_epoch: 4

norm_type: "RMSNorm"
