# Speed and host-memory options, each off when missing (on top of config/optimizations.yml).

# the DataLoader workers send only the real points of the source tokens, with the number of
# real points per token and the row each token is padded with; the embedding pads them on the
# GPU, chunk by chunk. Same tokens (identical batch checksums); level 5: 9x less source data,
# host memory per rank 63 -> 39 GiB; level 6: 34x less, 1 GiB less GPU memory, 12 workers fit
# (runs tz30c2cz, 160m47a2)
source_tokens_unpadded: True

# torch.compile the MLP and attention modules (flash-attention 3 runs eagerly in between, it
# has no fake kernels). Off: slower, as the step is bound by the CPU launching kernels and each
# compiled call adds wrapper work: level 5 5.10 instead of 4.09 s per step, level 6 16.4 instead
# of 15.5 (runs 0gath1pq, yi4knvey); a process sometimes segfaults at exit. Worth retrying with
# whole blocks compiled, once flash-attention is a torch custom op.
compile_blocks: False
