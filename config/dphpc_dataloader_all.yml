# Martin data-loader combined config: every flag verified on 2026-11-01 (see experiments/martin/LOG.md).
# even_workset_split (azmuvlzx: mean step -28%) + 4 reader flags (kawac1qm: prep -11%, RAM -3%)
# + 4 tokenizer flags (em2wu8xf: prep -11%); all 8 together re-checked in ppxxfvr2 (loss within noise,
# no GPU bump). 12 workers: ~33 s/sample / 12 = 2.75 s per sample, faster than the ~2.85 s GPU step,
# so 16 workers (+24% host RSS, c9cfzjqg) should be unnecessary. Profiling on for the comparison run.
# Use with --base-config config/config_operan_georing_avhrr_forecasting_lowres.yml.
profiling:
  memory_profiling: False
  pytorch_profiling: False
  only_profiling: False

train_logging:
  memory_tracking: True
  throughput_tracking: True
  metrics: 1
  terminal: 10

data_loading:
  rng_seed: 1
  # writes <run_dir>/dataloader_profile/: per-sample stage times, loader waits, memory CSV
  profile_timing: True
  profile_memory_timeline: True
  profile_memory_interval_seconds: 0.5

# data-loader options: flat keys, each off when missing (docs/martin_dataloader_flags.md)
even_workset_split: True
anemoi_select_vars: True
anemoi_avoid_dtype_copy: True
obs_single_read: True
skip_all_valid_filter_copy: True
tokenize_coords_only: True
source_direct_build: True
target_requested_fields_only: True
skip_train_inverse_indices: True

training_config:
  start_date: 2017-06-01T00:00
  num_mini_epochs: 1
  # 1 sample per GPU x 4 GPUs -> 100 steps
  samples_per_mini_epoch: 400

validation_config:
  samples_per_mini_epoch: 4

norm_type: "RMSNorm"
