# one activation checkpoint per attention + MLP block instead of per layer
# (forecast engine and local assimilation)
checkpoint_per_block: True

# one checkpoint per forecast step around the forecast engine: only the step input is kept
# until the backward (one more forecast-engine forward per step)
fe_checkpoint_per_step: True

# attention + MLP blocks per forecast-engine checkpoint
# requires: checkpoint_per_block
fe_blocks_per_checkpoint: 2

# reshard the forecast-engine weights after forward instead of keeping them gathered
# requires: training_config.forecast.pushforward off (it relies on gathered weights)
fe_reshard_after_forward: True

# decoder: project keys/values once per cell, then select each cell's 9 neighbours by index
# instead of copying them
decoder_gather_after_kv_projection: True

# keep the source tokens on the GPU in the mixed-precision dtype, as the embedding uses them
source_tokens_in_mixed_precision: True

# keep the source tokens in pinned CPU memory; the embedding copies them to the GPU when it runs
# (also in its recompute)
source_tokens_on_cpu: True

# checkpoint each block of the local-to-global adapter
ae_adapter_checkpoint: True

# one outer checkpoint per local-assimilation chunk (one more local forward)
ae_local_checkpoint_outer: True

# run the stream-embedding layers over this many chunks of patches (bounds the backward burst;
# 4 measured on the lowres operan config)
embed_num_chunks: 4

# one checkpoint per chunk of patches, patch embedding included: the backward rebuilds one
# chunk at a time and nothing of the size of a whole stream is kept.
# Note that this is subjective to the number set in embed_num_chunks as testing with
# embed_num_chunks: 2 did not reduce the memory and only increased the time.
# requires: embed_num_chunks > 1
embed_checkpoint_per_chunk: True

# copy the embedded tokens into cell order with index_copy_ (1D index) instead of scatter_
embed_index_copy: True

# run the decoder over this many groups of cells (smaller flash-attn backward scratch;
# 2 measured on the lowres operan config)
decoder_num_chunks: 2

# 'block' readout of the stream embedding as one batched matmul over the channels instead of
# a loop over them (same parameters, equal up to bf16 rounding)
embed_readout_batched: True

# data loader: the time-window and NaN filters reuse the arrays when every row is kept, instead
# of copying them
skip_all_valid_filter_copy: True

# data loader: build only the target fields each caller uses (coordinates or values), not both
# twice
target_requested_fields_only: True

# data loader: the observation reader reads the needed columns once instead of three times
# (coordinates, geoinfos, channels)
obs_single_read: True

# data loader: the Anemoi and Operan readers convert and transpose only the variables the stream
# uses (the read is unchanged: each zarr chunk holds all variables of a time step)
anemoi_select_vars: True

# free each batch before the next one is copied to the GPU (a reference cycle otherwise keeps
# it alive until the next garbage collection: +1.7 GiB on random steps)
train_gc_collect_every_step: True

# data loader: split the points of all cells into tokens with one sort, not one sort per cell
# (same tokens)
vectorize_hpy_splits: True

# data loader: split complete batches evenly over the loader workers; the remainder goes one each
# to the first workers instead of all to the last one
even_workset_split: True

# data loader: count the masked tokens and points per cell with one bincount (same counts)
masked_counts_bincount: True

# data loader: target local coordinates on the flat points, not split per cell (same values)
target_coords_flat: True

# EMA weights in pinned CPU memory
# requires: FSDP (distributed.data_parallel.with_fsdp, several GPUs) and
#   validation_config.validate_with_ema.enabled (otherwise there is no EMA model)
ema_on_cpu: True
