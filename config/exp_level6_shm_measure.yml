# Martin data-loader experiment: level 6, 4 workers, prefetch 1 (fits, a5z733w1) plus
# per-sample payload bytes and /dev/shm usage, to size how many workers fit (8 and 12 overflowed).
# 20 steps, optimizations off: does it fit host/GPU memory and time? Compare only to level-6 runs.
# Use with --base-config config/config_operan_georing_avhrr_forecasting_lowres.yml.
# Flag documentation: docs/martin_dataloader_flags.md
profiling:
  memory_profiling: False
  pytorch_profiling: False
  only_profiling: False

train_logging:
  memory_tracking: True
  throughput_tracking: True
  metrics: 1
  terminal: 10

data_loading:
  rng_seed: 1
  # writes <run_dir>/dataloader_profile/: per-sample stage times, loader waits, memory CSV
  profile_timing: True
  profile_memory_timeline: True
  profile_memory_interval_seconds: 0.5
  # w0a1jb0w (12 workers, prefetch 2) exhausted /dev/shm; fewer samples in flight
  num_workers: 4
  prefetch_factor: 1
  # record tensor/array bytes of every yielded sample (samples_*.jsonl "payload")
  profile_payload_bytes: True

training_config:
  start_date: 2017-06-01T00:00
  num_mini_epochs: 1
  # feasibility only: 1 sample per GPU x 4 GPUs -> 20 steps
  samples_per_mini_epoch: 80

validation_config:
  samples_per_mini_epoch: 4

norm_type: "RMSNorm"

healpix_level: 6
