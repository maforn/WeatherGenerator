# Martin data-loader experiment: HEALPix level 6, combined flags, 5 workers per rank, prefetch_factor 1.
# Sized from pi3kavlj: each yielded sample holds ~9.2 GiB of torch tensors (source_tokens_cells), and
# /dev/shm on a booster node is 239 GiB. In-flight samples ~= ranks x workers x prefetch: 4 workers used
# 148 GiB; 8 workers (es253qrq, ~294 GiB) and 12 (w0a1jb0w) overflowed. 5 workers ~= 184 GiB (77%);
# 6 would be ~221 GiB (92%), too tight. 40 steps. Compare only to level-6 runs. Use with --base-config
# config/config_operan_georing_avhrr_forecasting_lowres.yml.
profiling:
  memory_profiling: False
  pytorch_profiling: False
  only_profiling: False

train_logging:
  memory_tracking: True
  throughput_tracking: True
  metrics: 1
  terminal: 10

data_loading:
  rng_seed: 1
  # writes <run_dir>/dataloader_profile/: per-sample stage times, loader waits, memory CSV
  profile_timing: True
  profile_memory_timeline: True
  profile_memory_interval_seconds: 0.5
  num_workers: 5
  prefetch_factor: 1
  optimizations:
    even_workset_split: True
    anemoi_select_vars: True
    anemoi_avoid_dtype_copy: True
    obs_single_read: True
    skip_all_valid_filter_copy: True
    tokenize_coords_only: True
    source_direct_build: True
    target_requested_fields_only: True
    skip_train_inverse_indices: True

training_config:
  start_date: 2017-06-01T00:00
  num_mini_epochs: 1
  # 1 sample per GPU x 4 GPUs -> 40 steps
  samples_per_mini_epoch: 160

validation_config:
  samples_per_mini_epoch: 4

norm_type: "RMSNorm"

healpix_level: 6
